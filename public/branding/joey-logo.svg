<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" role="img" aria-label="JOEY">
  <!-- Official-style heavy JOEY wordmark: solid O, connectors J–O and O–E -->
  <g fill="#1C1917">
    <!-- J -->
    <path d="M8 4h28v28c0 10-6 16-18 16H4v-12h10c3 0 5-1.5 5-5V4z"/>
    <!-- connector J–O -->
    <rect x="32" y="20" width="10" height="8"/>
    <!-- O solid circle -->
    <circle cx="70" cy="26" r="22"/>
    <!-- connector O–E -->
    <rect x="88" y="20" width="10" height="8"/>
    <!-- E -->
    <path d="M96 4h40v12H112v4h20v8H112v4h24v12H96z"/>
    <!-- Y -->
    <path d="M142 4h16l10 18 10-18h16l-18 30v18h-16V34z"/>
  </g>
</svg>
